[package]
name = "stremio-wishlist"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }

# --- Durcissement (skill rust-new) ---
# clippy tourne avec -D warnings (hook + CI) : "warn" bloque aussi, mais reste lisible dans l'éditeur.
# Exception : #[allow(clippy::xxx, reason = "pourquoi")] au plus près du code concerné.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pas de crash caché en production
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Toute exception doit être justifiée
allow_attributes_without_reason = "warn"
# Bruit pédantique sans valeur sécurité
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
overflow-checks = true # un dépassement d'entier panique au lieu de boucler silencieusement

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
